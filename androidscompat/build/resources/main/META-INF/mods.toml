modId="androidscompat"
version="${file.jarVersion}"
displayName="CC:Androids Compatibility"
authors="Puentenorte"
description='''
Adds server-side compatibility between CC:Androids and NTGL weapons, aircraft
autopilot and optional proximity TTS. Adds the hostile Puente Norte faction,
custom soldier and Mortadelo entities, village raids, forward bases and a
player-specific Nemesis progression system.
'''

